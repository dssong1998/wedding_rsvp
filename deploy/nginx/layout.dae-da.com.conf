# Bonelli Layout — bonelli-layout 컨테이너 (별도 repo, deploy_default network)
# Cloudflare origin cert: *.dae-da.com 또는 layout.dae-da.com 포함 필요

server {
    listen 443 ssl;
    http2 on;
    server_name layout.dae-da.com;

    ssl_certificate     /etc/ssl/cloudflare/dae-da.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/dae-da.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 ipv6=off valid=30s;

    location / {
        set $layout_upstream bonelli-layout:80;
        proxy_pass http://$layout_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
