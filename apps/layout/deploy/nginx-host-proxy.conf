# Host nginx — dae-da.com 서버에서 Docker(proxy 모드) 앞단 SSL
# /etc/nginx/sites-available/layout.dae-da.com
#
# Docker: docker compose -f docker-compose.proxy.yml up -d  → 127.0.0.1:8080
# SSL: sudo certbot --nginx -d layout.dae-da.com

server {
    listen 80;
    listen [::]:80;
    server_name layout.dae-da.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name layout.dae-da.com;

    ssl_certificate     /etc/letsencrypt/live/layout.dae-da.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layout.dae-da.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
