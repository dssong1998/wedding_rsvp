# Cloudflare 사용 시 — origin SSL 불필요 (Flexible / Full+HTTP origin)
# /etc/nginx/sites-available/layout.dae-da.com
#
# Docker: npm run docker:proxy  → 127.0.0.1:8080
# Cloudflare: DNS 프록시(주황 구름) + SSL/TLS → Flexible 또는 Full

server {
    listen 80;
    listen [::]:80;
    server_name layout.dae-da.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
