# layout.dae-da.com — Bonelli Layout (Vite SPA static build)
#
# 1) DNS: layout.dae-da.com → 이 서버 IP
# 2) dist/ 내용을 root 경로에 업로드
# 3) certbot 등으로 SSL 발급 후 listen 443 블록 활성화
#
# include 예: /etc/nginx/sites-enabled/layout.dae-da.com

server {
    listen 80;
    listen [::]:80;
    server_name layout.dae-da.com;

    # certbot 사용 시 HTTP → HTTPS 리다이렉트 (인증서 발급 후 주석 해제)
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name layout.dae-da.com;

    # certbot --nginx -d layout.dae-da.com 실행 후 생성되는 경로로 교체
    # ssl_certificate     /etc/letsencrypt/live/layout.dae-da.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/layout.dae-da.com/privkey.pem;

    root /var/www/layout.dae-da.com;
    index index.html;

    # SPA — 경로 라우팅 없지만 404 시 index.html (공유 URL ?layout=... 포함)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashed assets — 장기 캐시
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # public/ 정적 파일 (타일셋 PNG 등)
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|json|txt|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # dev 전용 API — 프로덕션 빌드에는 없음
    location /api/ {
        return 404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
