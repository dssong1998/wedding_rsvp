# 기존 Docker nginx 컨테이너에 추가할 server 블록
# (nginx 컨테이너의 conf.d/ 등에 마운트하거나 include)
#
# 전제: bonelli-layout 컨테이너와 같은 Docker network
# upstream: http://bonelli-layout:80

server {
    listen 80;
    server_name layout.dae-da.com;

    location / {
        proxy_pass http://bonelli-layout:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
